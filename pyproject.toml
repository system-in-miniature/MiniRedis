[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "miniredis-course"
version = "0.1.0"
description = "A test-driven Python asyncio course for rebuilding Redis core mechanisms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "redis>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/miniredis"]

[tool.pytest.ini_options]
addopts = "-m 'not red'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "red: one deliberately failing contract reserved for the next course day",
  "interop: requires an optional external Redis client",
]

