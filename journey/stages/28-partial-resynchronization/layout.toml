[[blocks]]
id = "partial-sink"
title_en = "Catch-up before live streaming"
title_zh = "Catch-up 先于 Live Streaming"
summary_en = "Retain a cursor across disconnect, apply the frozen backlog suffix before concurrently queued live batches, detect sequence gaps, and reattach after overflow or source loss."
summary_zh = "Disconnect 后保留 Cursor，先应用 Frozen Backlog Suffix 再应用并发排队 Live Batch，检测 Sequence Gap，并在 Overflow 或 Source Loss 后重新 Attach。"
files = ["src/miniredis/replication/sink.py"]

