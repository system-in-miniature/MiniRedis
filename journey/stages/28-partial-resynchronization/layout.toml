title_zh = "Resume 可观测性"
summary_en = "Expose retained backlog count and oldest sequence so tests and operators can explain partial versus full fallback."
summary_zh = "暴露 Retained Backlog Count 与 Oldest Sequence，使测试与 Operator 能解释 Partial 与 Full Fallback。"
