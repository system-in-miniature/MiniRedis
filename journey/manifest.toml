[project]
name = "MiniRedis"
package = "miniredis"
repository_url = "https://github.com/system-in-miniature/mini-redis"
owned_roots = [
  "src/miniredis",
  "examples",
  "tests/adapters",
  "tests/concurrency",
  "tests/contract",
  "tests/helpers",
  "tests/interop",
  "tests/mechanisms",
  "tests/reliability",
  "tests/replication",
  "tests/unit",
]
owned_files = ["pyproject.toml", "uv.lock", "tests/__init__.py"]

